[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-surface"
version = "0.1.0"
description = "Superficie di volatilità implicita, confronto con la vol realizzata e delta hedging"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
dati = ["yfinance>=0.2.40"]
notebook = ["nbformat>=5", "nbclient>=0.8", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]
